<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empresa | Leiria Maps</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">

<style>
.profile{max-width:950px;margin:35px auto;padding:20px}
.cover{width:100%;height:280px;object-fit:cover;border-radius:16px;background:#eee}
.profile-head{display:flex;align-items:center;gap:18px;margin:22px 0}
.logo{width:100px;height:100px;object-fit:contain;background:white;border:1px solid #eee;border-radius:14px}
.profile h1{font-size:30px;margin:0 0 8px}
.profile p{color:#666;line-height:1.7}
.profile-info{background:white;padding:22px;border:1px solid #eee;border-radius:14px;margin:20px 0}
.profile-info a{color:#d92332}
#businessMap{height:350px;border-radius:14px;margin-top:15px}
.profile-button{display:inline-block;background:#d92332;color:white;padding:12px 18px;border-radius:8px;text-decoration:none;margin:8px 5px 8px 0}
@media(max-width:600px){
 .cover{height:190px}
 .profile-head{align-items:flex-start}
 .logo{width:75px;height:75px}
 .profile h1{font-size:23px}
}
</style>
</head>

<body>

<header class="topbar">
<a class="brand" href="./">LEIRIA MAPS</a>
<a class="header-cta" href="./">Voltar ao mapa</a>
</header>

<main class="profile">

<div id="loading">A carregar empresa...</div>

<section id="businessProfile" hidden>

<img id="cover" class="cover" alt="Imagem de capa">

<div class="profile-head">
<img id="logo" class="logo" alt="Logótipo">
<div>
<h1 id="name"></h1>
<span id="category"></span>
</div>
</div>

<div class="profile-info">
<h3>Sobre a empresa</h3>
<p id="description"></p>

<div class="profile-info" id="directionsPanel">
  <h3>Como chegar</h3>
  <p>Escolhe o teu ponto de partida:</p>

  <input
    id="startPoint"
    type="text"
    placeholder="Escreve uma morada ou local"
    style="width:100%;padding:12px;box-sizing:border-box;"
  >

  <button class="profile-button" id="routeButton" type="button">
    Traçar rota
  </button>

  <button class="profile-button" id="locationButton" type="button">
    Usar a minha localização
  </button>

  <p id="routeStatus"></p>
  <div id="routeSummary" hidden></div>
  <ol id="routeSteps"></ol>
</div>
 
 <h3>Contactos</h3>
<p id="phone"></p>
<p id="website"></p>

<h3>Morada</h3>
<p id="address"></p>
</div>

<div class="profile-info">
<h3>Localização</h3>
<div id="businessMap"></div>

</div>

</section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<div style="margin-top:12px;">
  <button class="profile-button" id="startTracking" type="button">
    Acompanhar a minha localização
  </button>

  <button class="profile-button" id="stopTracking" type="button">
    Parar acompanhamento
  </button>
</div>

<p id="trackingStatus"></p>
<script>
const cfg=window.LEIRIA_MAPS_CONFIG;
const db=window.supabase.createClient(
 cfg.SUPABASE_URL,
 cfg.SUPABASE_ANON_KEY
);

let map = null;
let destination = null;
let routeLayer = null;

const id = new URLSearchParams(location.search).get("id");

async function geocodeAddress(address) {
  const url = "https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(address);

  const response = await fetch(url);
  const data = await response.json();

  if (!data.features || !data.features.length) {
    throw new Error("Morada não encontrada.");
  }

  const coordinates = data.features[0].geometry.coordinates;

  return {
    lng: coordinates[0],
    lat: coordinates[1]
  };
}

async function drawRoute(origin) {
  if (!destination || !map) {
    routeMessage("Localização da empresa indisponível.");
    return;
  }

  const status = document.getElementById("routeStatus");
  status.textContent = "A calcular percurso...";

  try {
    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      origin.lng + "," + origin.lat + ";" +
      destination.lng + "," + destination.lat +
      "?overview=full&geometries=geojson&steps=true";

    const response = await fetch(url);
    const data = await response.json();

    if (data.code !== "Ok" || !data.routes.length) {
      throw new Error("Não foi possível calcular a rota.");
    }

    if (routeLayer) map.removeLayer(routeLayer);

    routeLayer = L.geoJSON(data.routes[0].geometry, {
      style: {
        color: "#d92332",
        weight: 6,
        opacity: 0.9
      }
    }).addTo(map);

    const route = data.routes[0];
    const km = (route.distance / 1000).toFixed(1);
    const minutes = Math.round(route.duration / 60);

    document.getElementById("routeSummary").hidden = false;
    document.getElementById("routeSummary").textContent =
      "Distância: " + km + " km · Tempo estimado: " + minutes + " min";

    const stepsList = document.getElementById("routeSteps");
    stepsList.innerHTML = "";

    const directions = {
      depart: "Começa o percurso",
      turn: "Vira",
      continue: "Continua",
      merge: "Entra",
      fork: "Segue na bifurcação",
      "end of road": "No fim da estrada, vira",
      roundabout: "Entra na rotunda",
      rotary: "Segue na rotunda",
      arrive: "Chegaste ao destino"
    };

    route.legs.forEach(leg => {
      leg.steps.forEach(step => {
        const type = step.maneuver.type;
        const modifier = step.maneuver.modifier || "";
        const road = step.name ? " para " + step.name : "";

        let instruction = directions[type] || "Continua";

        if (type === "turn" || type === "end of road") {
          instruction += " " + modifier;
        }

        const li = document.createElement("li");
        li.textContent = instruction + road;
        li.style.padding = "8px 0";

        stepsList.appendChild(li);
      });
    });

    map.fitBounds(routeLayer.getBounds(), {
      padding: [25, 25]
    });

    status.textContent = "Percurso calculado com sucesso!";

  } catch (error) {
    status.textContent = error.message;
  }
}
 
function showText(elementId,value){
 document.getElementById(elementId).textContent=value||"Não indicado";
}

async function loadProfile(){
 if(!id){
  document.getElementById("loading").textContent="Empresa não encontrada.";
  return;
 }

 const {data,error}=await db
  .from("businesses")
  .select("id,name,category,address,description,phone,website,lat,lng,logo_url,cover_url")
  .eq("id",id)
  .eq("status","approved")
  .maybeSingle();

 if(error||!data){
  document.getElementById("loading").textContent="Não foi possível encontrar esta empresa.";
  return;
 }

 const p=data;

 showText("name",p.name);
 showText("category",p.category);
 showText("description",p.description);
 showText("phone",p.phone);
 showText("address",p.address);

 const website=document.getElementById("website");
 website.textContent=p.website||"Website não indicado";

 if(p.website){
  website.innerHTML="";
  const link=document.createElement("a");
  link.href=p.website;
  link.textContent="Visitar website";
  link.target="_blank";
  link.rel="noopener noreferrer";
  website.appendChild(link);
 }

 if(p.logo_url){
  document.getElementById("logo").src=p.logo_url;
 }else{
  document.getElementById("logo").hidden=true;
 }

 if(p.cover_url){
  document.getElementById("cover").src=p.cover_url;
 }else{
  document.getElementById("cover").hidden=true;
 }

 document.getElementById("loading").hidden=true;
 document.getElementById("businessProfile").hidden=false;

 if(p.lat!==null&&p.lng!==null){
  map=L.map("businessMap").setView([p.lat,p.lng],16);

destination={
  lat:Number(p.lat),
  lng:Number(p.lng)
};

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
   maxZoom:19,
   attribution:"© OpenStreetMap"
  }).addTo(map);

  L.marker([p.lat,p.lng])
   .addTo(map)
   .bindPopup(p.name)
   .openPopup();
 }
}

document.getElementById("routeButton").addEventListener("click", async () => {
  const address = document.getElementById("startPoint").value.trim();

  if (!address) {
    document.getElementById("routeStatus").textContent =
      "Escreve primeiro o ponto de partida.";
    return;
  }

  try {
    document.getElementById("routeStatus").textContent =
      "A procurar morada...";

    const origin = await geocodeAddress(address);
    await drawRoute(origin);

  } catch (error) {
    document.getElementById("routeStatus").textContent = error.message;
  }
});

document.getElementById("locationButton").addEventListener("click", () => {
  navigator.geolocation.getCurrentPosition(
    position => {
      drawRoute({
        lat: position.coords.latitude,
        lng: position.coords.longitude
      });
    },
    () => {
      document.getElementById("routeStatus").textContent =
        "Não foi possível obter a localização. Escreve uma morada.";
    }
  );
});
 
  let currentLocationMarker = null;

document.getElementById("startTracking").addEventListener("click", () => {
  const status = document.getElementById("trackingStatus");

  if (!navigator.geolocation) {
    status.textContent = "Localização não suportada pelo navegador.";
    return;
  }

  status.textContent = "A obter a tua localização...";

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!map) {
        status.textContent = "O mapa ainda não está disponível.";
        return;
      }

      if (currentLocationMarker) {
        map.removeLayer(currentLocationMarker);
      }

      currentLocationMarker = L.marker([lat, lng])
        .addTo(map)
        .bindPopup("A tua localização");

      map.setView([lat, lng], 16);
      currentLocationMarker.openPopup();

      status.textContent = "Localização apresentada no mapa.";
    },
    () => {
      status.textContent = "Não foi possível obter a localização. Verifica as permissões.";
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
});

document.getElementById("stopTracking").addEventListener("click", () => {
  if (currentLocationMarker && map) {
    map.removeLayer(currentLocationMarker);
    currentLocationMarker = null;
  }

  document.getElementById("trackingStatus").textContent =
    "Marcador de localização removido.";
});
 
 loadProfile();
</script>

</body>
</html>
